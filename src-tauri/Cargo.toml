[package]
name = "parikaram"
version = "0.1.0"
description = "Parikaram — Native desktop browser & spatial AI work environment"
authors = ["Aumnamaha"]
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "parikaram"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
